<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>macOS Python Studio</title>
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
  
  <!-- CodeMirror Core & Python Mode -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  
  <!-- CodeMirror Addons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/python-hint.min.js"></script>
  
  <!-- Pyodide Core -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Startup Loader -->
  <div id="loading-screen">
    <div class="mac-loader">
      <i class="ph-fill ph-apple-logo"></i>
      <div class="mac-progress-track">
        <div class="mac-progress-fill"></div>
      </div>
      <span class="startup-text">Starting Python Environment...</span>
    </div>
  </div>

  <!-- Mac Desktop Background Wrapper -->
  <div class="mac-desktop">
    <!-- Modern Rounded Mac Window -->
    <div id="mac-window" class="hidden">
      
      <!-- Left Pane: Problem Description -->
      <div class="pane left-pane">
        <!-- Integrated Traffic Lights -->
        <div class="pane-header mac-vibrancy">
          <div class="mac-traffic-lights">
            <div class="mac-btn close"></div>
            <div class="mac-btn minimize"></div>
            <div class="mac-btn maximize"></div>
          </div>
          <span class="doc-tag">MARKDOWN</span>
        </div>
        
        <div class="markdown-body">
          <button id="btn-next-problem" class="btn-refresh"><i class="ph ph-arrows-clockwise"></i> Load New</button>
          <h1 id="problem-title" class="title-heading">...</h1>
          <div id="problem-desc" class="desc-content">...</div>
          <div class="border-divider"></div>
          <div id="problem-examples" class="examples-block"></div>
          <div class="target-spec">
            <i class="ph ph-timer"></i> Target: &le; <span id="target-time">0</span>ms
          </div>
        </div>
      </div>

      <!-- Right Pane: Mac Editor + Mac zsh Terminal -->
      <div class="pane right-pane">
        
        <!-- VS Code Mac Style Editor Header -->
        <div class="mac-editor-toolbar mac-vibrancy">
          <div class="mac-tabs">
            <div class="mac-tab active">
              <i class="ph-fill ph-file-code" style="color: #4daafc;"></i>
              <span>solution.py</span>
            </div>
          </div>

          <!-- Mac Editor Actions (RUN BUTTON HERE) -->
          <div class="mac-actions">
            <button id="btn-reset" class="mac-icon-btn" title="Reset Code">
              <i class="ph ph-arrow-counter-clockwise"></i>
            </button>
            <div class="action-divider"></div>
            <button id="btn-run" class="mac-play-pill" title="Run Code (Cmd+Enter)">
              <i class="ph-fill ph-play"></i>
              <span>Run</span>
            </button>
          </div>
        </div>
        
        <!-- CodeMirror Editor Container -->
        <div class="editor-wrapper">
          <textarea id="code-editor"></textarea>
        </div>

        <!-- Mac zsh Terminal Area -->
        <div class="mac-terminal">
          <!-- Terminal Panel Header -->
          <div class="terminal-panel-header mac-vibrancy">
            <div class="term-tabs">
              <div class="term-tab">PROBLEMS</div>
              <div class="term-tab">OUTPUT</div>
              <div class="term-tab active">TERMINAL</div>
            </div>
            <div class="term-actions">
              <i class="ph ph-plus"></i>
              <i class="ph ph-split-horizontal"></i>
              <i class="ph ph-trash"></i>
              <i class="ph ph-x"></i>
            </div>
          </div>

          <!-- Terminal Output Screen -->
          <div id="terminal-screen" class="terminal-body">
            <div class="terminal-line text-muted">Last login: <span id="login-time"></span> on ttys001</div>
            <div id="terminal-log-stream">
              <div class="terminal-line prompt-line">
                <span class="prompt-user">dev@MacBook-Pro</span> <span class="prompt-dir">python-practice</span> % <span class="text-muted">_</span>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="mock-ai.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
