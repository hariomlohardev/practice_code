<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>macOS Developer Studio</title>
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/nord.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css" />
  
  <!-- CodeMirror Core & Addons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
  
  <!-- Pyodide Core -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-screen" class="macos-overlay">
    <div class="loader-box">
      <div class="spinner"></div>
      <div class="loader-text">Waking up Engine...</div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Desktop Environment -->
  <div class="desktop-environment">
    <div id="macos-app" class="macos-window hidden">
      
      <!-- Top Bar -->
      <header class="top-bar drag-zone">
        <div class="traffic-lights">
          <div class="dot red"></div>
          <div class="dot yellow"></div>
          <div class="dot green"></div>
        </div>
        
        <div class="top-bar-center">
          <i class="ph-fill ph-folder" style="color: var(--accent);"></i>
          <span class="file-title">main.py</span>
        </div>

        <div class="top-bar-actions">
          <button id="btn-reset" class="btn btn-secondary">
            <i class="ph ph-arrow-counter-clockwise"></i> Reset
          </button>
          <button id="btn-run" class="btn btn-primary">
            <i class="ph-fill ph-play"></i> Run <span class="kbd">⌘↵</span>
          </button>
        </div>
      </header>

      <!-- Main Layout -->
      <div class="app-layout">
        
        <!-- Sidebar -->
        <aside class="sidebar">
          <div class="sidebar-header">
            <span class="section-caps">SPECIFICATION</span>
            <button id="btn-next-problem" class="icon-btn" title="Next Problem">
              <i class="ph ph-arrows-clockwise"></i>
            </button>
          </div>
          
          <div class="sidebar-content">
            <h1 id="problem-title" class="title-1">...</h1>
            <p id="problem-desc" class="body-text">...</p>
            <div class="divider"></div>
            <span class="section-caps">TEST CASES</span>
            <div id="problem-examples" class="examples-grid"></div>
            <div class="info-callout">
              <i class="ph-fill ph-timer"></i> 
              <span>Target: &le; <span id="target-time">0</span>ms</span>
            </div>
          </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
          
          <!-- Code Editor -->
          <div class="editor-section">
            <textarea id="code-editor"></textarea>
          </div>

          <!-- Bottom Panel: Terminal & Pytest Tabs -->
          <div class="terminal-panel">
            <div class="panel-header">
              <span class="tab active" id="tab-zsh"><i class="ph ph-terminal-window"></i> zsh</span>
              <span class="tab" id="tab-pytest"><i class="ph ph-check-circle"></i> pytest</span>
              <div class="spacer"></div>
              <i class="ph ph-trash action-icon" id="btn-clear-term" title="Clear Console (⌘K)"></i>
            </div>
            
            <div id="terminal-screen" class="terminal-content">
              <div class="term-line text-tertiary">Session started: <span id="login-time"></span> on ttys001</div>
              <div id="terminal-log-stream">
                <!-- Terminal stream -->
              </div>
            </div>
          </div>

        </main>
      </div>
    </div>
  </div>

  <!-- Dedicated IntelliSense Engine -->
  <script src="python-intellisense.js"></script>
  <script src="mock-ai.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
